name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruamel.yaml psycopg2-binary

      - name: Rodar testes
        run: pytest -q
